<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALLA - Registrarse</title>
    <link rel="stylesheet" href="css/styles.css"> 
    <link rel="stylesheet" href="css/registrarse.css">
</head>
<body>

<header class="encabezado" style="background-color: black; padding: 20px 40px; display: flex; align-items: center;">
    <div class="orden-de-ecabezado" style="display: flex; align-items: center; width: 100%;">
        <a class="logo-valla" href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 15px;">
            <img class="logo" src="img/header.png" alt="VALLA" style="height: 40px;">
            <h1 class="titulo-header-favoritos" style="color: white; font-size: 22px; margin: 0;">REGISTRARSE</h1>
        </a>
    </div>
</header>

<main class="contenedor-registro wrap">
    <form class="formulario-valla" netlify>
        <div class="grupo-formulario">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" placeholder="Escribir aquí" required />
        </div>

        <div class="grupo-formulario">
            <label for="email">Gmail:</label>
            <input type="email" id="email" name="email" placeholder="Escribir aquí" required />
        </div>

        <div class="bloque-boton">
            <button type="submit" class="btn-ok">OK</button>
        </div>
    </form>
</main>

</body>
</html>
