<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VALLA - Registrarse</title>
  
  <style>
    /* =========================================
       RESET Y CONFIGURACIÓN GENERAL
       ========================================= */
    :root {
      --container: 980px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #ffffff;
    }

    .wrap {
      width: min(var(--container), calc(100% - 48px));
      margin: 0 auto;
    }

    /* =========================================
       HEADER NEGRO (COMO EN LAS CAPTURAS)
       ========================================= */
    .encabezado-registro {
      background-color: #0b0b0b;
      width: 100%;
      padding: 24px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor-logo-registro {
      width: 100%;
      max-width: var(--container);
      display: flex;
      justify-content: center;
      padding: 0 24px;
    }

    .logo-bienvenida {
      display: block;
      max-width: 100%;
      height: auto;
      mix-blend-mode: screen; /* Quita el fondo blanco de la imagen */
    }

    /* =========================================
       FORMULARIO REDONDEADO (COMO EN TU DISEÑO)
       ========================================= */
    .contenedor-registro {
      display: flex;
      justify-content: center;
      padding: 60px 0; /* Empuja el formulario abajo de la barra negra */
    }

    .formulario-valla {
      width: 100%;
      max-width: 500px;
    }

    .grupo-formulario {
      margin-bottom: 24px;
    }

    .grupo-formulario label {
      display: block;
      font-size: 18px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #0b0b0b;
    }

    .grupo-formulario input {
      width: 100%;
      padding: 14px 20px;
      font-size: 16px;
      border: 2px solid #000000;
      border-radius: 18px; /* Bordes bien redondeados */
      outline: none;
      background-color: #ffffff;
    }

    .grupo-formulario input::placeholder {
      color: #888888;
    }

    /* BOTÓN SUBMIT NEGRO A LA DERECHA */
    .bloque-boton {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-top: 20px;
    }

    .btn-ok {
      background-color: #0b0b0b;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      padding: 12px 32px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-ok:hover {
      background-color: #222222;
    }
  </style>
</head>
<body>

  <header class="encabezado-registro">
    <div class="contenedor-logo-registro">
      <a href="index.html">
        <img class="logo-bienvenida" src="img/logo-registrarse.png" alt="Bienvenido a VALLA" />
      </a>
    </div>
  </header>

  <main class="contenedor-registro wrap">
    <form class="formulario-valla">
      
      <div class="grupo-formulario">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Escribir aquí" required />
      </div>

      <div class="grupo-formulario">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Escribir aquí" required />
      </div>

      <div class="bloque-boton">
        <button type="submit" class="btn-ok">Submit</button>
      </div>

    </form>
  </main>

</body>
</html>
