<div class="favorito-card">

            <img src="img/babasonicos.jpg" alt="Babasónicos"> 

            <div class="favorito-info">
                <h3>Babasónicos</h3>
                <p>DE GIRA</p>
            </div>

        </div>

        <div class="favorito-card">
            <!-- Agregado el img/ -->
            <img src="img/miranda.jpg" alt="Miranda!">

            <div class="favorito-info">
                <h3>Miranda!</h3>
            </div>
            <div class="favorito-star">★</div>
        </div>

        <div class="favorito-card">
            <!-- Agregado el img/ -->
            <img src="img/ozuna.jpg" alt="Ozuna">

            <div class="favorito-info">
                <h3>Ozuna</h3>
                <p>DE GIRA</p>
            </div>

        <div class="favorito-card">

            <div class="favorito-info">

                <p>DE GIRA</p>
            </div>
            <div class="favorito-star">★</div>
        </div>

        <div class="favorito-card">
            <!-- Agregado el img/ -->
            <img src="img/pablo.webp" alt="Pablo Chill-E">

            <div class="favorito-info">
                <h3>Pablo Chill-E</h3>
            </div>
            <div class="favorito-star">★</div>

        <div class="favorito-card">

<footer class="footer">
    <img src="img/foot.png" alt="" class="footer-art">
</footer>

<!-- SCRIPT PARA QUE LA BARRA FILTRE LOS ARTISTAS -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const buscador = document.getElementById("buscador-artistas");
        const tarjetas = document.querySelectorAll(".favorito-card");

        buscador.addEventListener("input", (evento) => {
            const textoBuscado = evento.target.value.toLowerCase();

            tarjetas.forEach(tarjeta => {
                const nombreArtista = tarjeta.querySelector("h3").textContent.toLowerCase();
                
                // Si coincide el texto, mostramos la tarjeta como "flex" (tu diseño original). Si no, la ocultamos.
                if (nombreArtista.includes(textoBuscado)) {
                    tarjeta.style.display = "flex";
                } else {
                    tarjeta.style.display = "none";
                }
            });
        });
    });
</script>

</body>
